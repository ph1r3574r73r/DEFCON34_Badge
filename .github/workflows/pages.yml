# Deploy The Light Bank (GitHub Pages)
#
# The site is plain static HTML/JS/CSS under tools/genomics/ — no Node, no npm.
# Before the first run: repo Settings → Pages → Source = GitHub Actions.
# Then Actions → this workflow → Run workflow (or push a genomics change).

name: Deploy The Light Bank (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "tools/genomics/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage site root
        run: |
          mkdir -p _site
          # Static Light Bank only (no promo JPGs / local SVG exporter)
          rsync -a \
            --exclude '*.jpg' \
            --exclude '*.jpeg' \
            --exclude '*.webp' \
            --exclude '*.png' \
            --exclude 'export_badge_svg.py' \
            --exclude 'README.md' \
            tools/genomics/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
