name: Deploy The Light Bank (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "tools/genomics/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site root
        run: |
          mkdir -p _site
          # Ship only the static Light Bank (ignore reference JPGs via rsync exclude)
          rsync -a \
            --exclude '*.jpg' \
            --exclude 'export_badge_svg.py' \
            --exclude '.github' \
            --exclude '.gitignore' \
            tools/genomics/ _site/
          # Keep Jekyll from mangling paths
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
